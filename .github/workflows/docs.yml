name: Documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'README.md', 'assets/**', 'tools/docs/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'README.md', 'assets/**', 'tools/docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.9.21'
      - name: Test the exporter
        run: uv run --locked tools/docs/build.py --test
      - name: Build and check links
        run: uv run --locked tools/docs/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
