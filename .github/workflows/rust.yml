name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf emacs-nox

    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    - uses: pnpm/action-setup@v6
      with:
        version: '11.19.0'

    - name: Build and test GUI frontend
      working-directory: vrsjmp
      run: |
        pnpm install --frozen-lockfile
        pnpm build
        pnpm test

    - name: Format
      run: cargo fmt --all --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    - name: Build
      run: cargo build --workspace --locked --features vrsjmp/custom-protocol

    - name: Test
      run: cargo test --workspace --locked

    - name: Test optimized runtime
      run: cargo test --release --locked -p lyric -p vrs -p vrsd

    - name: Test release CLI startup and output
      run: |
        cargo build --release --locked --bin vrsd --bin vrsctl
        cargo test --release --locked -p vrsctl --test terminal
