name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # From https://github.com/tauri-apps/tauri-action 
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf sqlite3 jq

    - name: Format
      run: cargo fmt --check

    - name: Build
      run: cargo build --verbose

    - name: Test
      run: cargo test --verbose

    - name: Test optimized runtime
      run: cargo test --release -p lyric -p vrs -p vrsd

    - name: Test release CLI startup and output
      run: |
        cargo build --release --bin vrsd --bin vrsctl
        VRS_TEST_PROFILE=release python3 vrsctl/tests/terminal.py
